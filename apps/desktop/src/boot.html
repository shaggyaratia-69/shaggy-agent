<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaggy The Agent</title>
  <link rel="stylesheet" href="boot.css" />
</head>
<body>
  <main class="boot-shell">
    <section class="brand-panel">
      <p class="eyebrow">Private Local Agent</p>
      <h1>Shaggy<br />The Agent</h1>
      <p class="subcopy">Starting your local Shaggy operator and opening the private desktop workspace.</p>
      <div class="progress-wrap">
        <div id="progress" class="progress-bar"></div>
      </div>
      <p id="message" class="message">Preparing Shaggy The Agent…</p>
    </section>
    <section class="preview-panel" aria-label="Startup logs">
      <div class="window-top"><span></span><span></span><span></span><strong>BOOT</strong></div>
      <pre id="logs">Waiting for startup logs…</pre>
    </section>
  </main>
  <script src="boot.js"></script>
</body>
</html>
